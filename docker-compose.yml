services:
  # NestJS API backend service
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
      target: development
    container_name: cagri_api
    restart: always
    environment:
      PORT: 3000
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      # Bind project directory for local live-reload
      - .:/app
      # Guard node_modules inside containers from being overwritten by host bindings
      - /app/node_modules
      - /app/apps/api/node_modules
      - /app/packages/shared/node_modules
